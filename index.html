<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>摄影书籍资源库 · 725 本摄影书合辑</title>
<meta name="description" content="摄影书籍合集：入门、器材、用光、构图、人像、风光、后期、教材、大师鉴赏等 19 类共 18.9 GB，全部为本人百度网盘直出链接。">
<link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/292/main/result.css"></noscript>
<style>
/* 视觉语言对齐 appmiu.com（b2 + appmiu-refinement/polish 的令牌与组件） */
:root{--appmiu-accent:#ff8a1f;--appmiu-accent-strong:#ef6c00;--appmiu-ink:#19202d;--appmiu-muted:#687386;
--appmiu-surface:#fff;--appmiu-surface-soft:#f5f7fb;--appmiu-line:#e6eaf0;
--appmiu-shadow:0 18px 50px rgba(24,34,53,.10);--appmiu-pressed:#142139;
--appmiu-glass:rgba(255,255,255,.62);--appmiu-glass-line:rgba(255,255,255,.72)}
html.appmiu-dark{color-scheme:dark;--appmiu-ink:#edf2f8;--appmiu-muted:#aab4c4;--appmiu-surface:#151b27;
--appmiu-surface-soft:#101522;--appmiu-line:#2b3444;--appmiu-shadow:0 18px 50px rgba(0,0,0,.28);
--appmiu-pressed:#edf2f8;--appmiu-glass:rgba(21,27,39,.72);--appmiu-glass-line:rgba(170,184,210,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:"LXGW WenKai","霞鹜文楷","Klee One","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
font-weight:normal;font-size:15px;line-height:1.7;color:var(--appmiu-ink);background:var(--appmiu-surface-soft);
-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
#page{width:100%}

/* ---------- hero ---------- */
.appmiu-hero{position:relative;isolation:isolate;display:flex;flex-direction:column;
padding:54px 24px 118px;color:#fff;background:linear-gradient(125deg,rgba(9,19,37,.92),rgba(21,83,113,.7)),
linear-gradient(135deg,#15243a,#166878)}
.appmiu-hero::before{content:"";position:absolute;inset:0;z-index:-1;
background:radial-gradient(circle at 72% 24%,rgba(74,222,204,.3),transparent 35%),
radial-gradient(circle at 18% 82%,rgba(255,138,31,.22),transparent 40%)}
.appmiu-hero__inner{display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
margin:0 auto;max-width:1000px;text-align:center}
.appmiu-eyebrow{margin:0 0 10px;font-size:12px;letter-spacing:.34em;color:rgba(255,255,255,.62)}
.appmiu-hero h1{max-width:650px;margin:0;font-size:clamp(30px,4vw,52px);line-height:1.2;font-weight:700;letter-spacing:.01em}
.appmiu-hero__sub{margin:14px 0 0;max-width:60ch;color:rgba(255,255,255,.8);font-size:15px}

/* ---------- hero search ---------- */
.appmiu-hero-search{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);z-index:4;
width:min(1200px,calc(100% - 48px));min-height:60px;display:grid;grid-template-columns:24px 1fr auto;
align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:18px;background:var(--appmiu-glass);
border:1px solid var(--appmiu-glass-line);box-shadow:0 8px 28px rgba(25,32,45,.08);
backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);color:var(--appmiu-ink)}
.appmiu-hero-search svg{width:18px;height:18px;color:var(--appmiu-muted)}
.appmiu-hero-search input{height:42px;border:0;background:none;outline:none;font-size:15px;min-width:0;width:100%}
.appmiu-hero-search input::placeholder{color:var(--appmiu-muted)}
.appmiu-hero-search button{height:42px;min-width:60px;padding:0 16px;border:0;border-radius:10px;
background:#101d34;color:#fff;cursor:pointer;font-size:14px;transition:.18s}
@media(hover:hover){.appmiu-hero-search button:hover{background:var(--appmiu-accent-strong)}}
html.appmiu-dark .appmiu-hero-search{background:var(--appmiu-surface);border-color:var(--appmiu-line)}

/* ---------- topic chips ---------- */
.appmiu-hero-topics{width:100%;margin-top:34px}
.appmiu-filter-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.appmiu-filter-chips button{display:inline-flex;align-items:center;gap:7px;border:0;padding:8px 12px;
min-height:38px;border-radius:8px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.86);
font-size:14px;cursor:pointer;transition:.16s}
@media(hover:hover){.appmiu-filter-chips button:hover{background:rgba(255,255,255,.2);color:#fff}}
.appmiu-filter-chips button b{font-weight:400;font-size:11px;opacity:.68}
.appmiu-filter-chips button[aria-pressed="true"]{background:#fff;color:var(--appmiu-pressed)}
.appmiu-filter-chips .dot{width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- quick tag row ---------- */
.appmiu-search-terms{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;
width:min(1200px,calc(100% - 48px));margin:52px auto 0;padding-bottom:3px;scrollbar-width:none;
-webkit-overflow-scrolling:touch}
.appmiu-search-terms::-webkit-scrollbar{display:none}
.appmiu-search-terms button{flex:none;border:1px solid var(--appmiu-line);background:var(--appmiu-surface);
color:var(--appmiu-muted);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;min-height:36px}
@media(hover:hover){.appmiu-search-terms button:hover{color:var(--appmiu-accent-strong);border-color:var(--appmiu-accent)}}

/* ---------- discovery layout ---------- */
.appmiu-discovery{position:relative;isolation:isolate;width:min(1640px,calc(100% - 48px));margin:22px auto 0;padding:24px 0 34px}
.appmiu-discovery__layout{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:24px;align-items:start}
.appmiu-filter-panel,.appmiu-discover-more,.appmiu-results-summary{background:var(--appmiu-glass);
backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);
border:1px solid var(--appmiu-glass-line);box-shadow:0 8px 28px rgba(25,32,45,.045);border-radius:14px}
.appmiu-filter-panel{position:sticky;top:20px;padding:18px;min-width:0}
.appmiu-filter-panel__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.appmiu-filter-panel__head h3,.appmiu-discover-more h3{font-size:17px;margin:0}
.appmiu-filter-panel__head>span{font-size:11px;color:var(--appmiu-muted)}
.appmiu-filter{display:grid;gap:12px;margin:16px 0}
.appmiu-filter label{display:grid;gap:5px;min-width:0}
.appmiu-filter label>span{font-size:12px;color:var(--appmiu-muted)}
.appmiu-filter select{width:100%;border:1px solid var(--appmiu-line);border-radius:8px;
background:var(--appmiu-surface);padding:8px 10px;font-size:14px;cursor:pointer;min-height:40px}
.appmiu-filter-reset{width:100%;border:1px dashed var(--appmiu-line);background:none;border-radius:8px;
color:var(--appmiu-muted);padding:9px;font-size:12px;cursor:pointer}
@media(hover:hover){.appmiu-filter-reset:hover{color:var(--appmiu-accent-strong);border-color:var(--appmiu-accent)}}

.appmiu-discover-more{position:sticky;top:20px;padding:18px}
.appmiu-discover-more h4{font-size:13px;color:var(--appmiu-muted);margin:20px 0 10px;font-weight:400}
.appmiu-hot-tags{display:flex;flex-wrap:wrap;gap:5px}
.appmiu-hot-tags button{flex:1 1 auto;min-width:0;padding:5px 6px;font-size:11px;line-height:1.5;text-align:center;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:4px;
background:var(--appmiu-surface-soft);color:var(--appmiu-muted);cursor:pointer}
html.appmiu-dark .appmiu-hot-tags button{background:var(--appmiu-surface-soft)}
@media(hover:hover){.appmiu-hot-tags button:hover{color:var(--appmiu-ink);background:var(--appmiu-line)}}
.appmiu-discover-more ol{padding-left:20px;margin:0}
.appmiu-discover-more li{padding:0 0 12px 4px;line-height:1.6;font-size:12px;color:var(--appmiu-muted)}
.appmiu-discover-more li b{color:var(--appmiu-ink);font-weight:400}

/* ---------- results ---------- */
.appmiu-results{min-width:0}
.appmiu-results-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:10px 14px;margin-bottom:14px;border-radius:14px}
.appmiu-results-summary strong{font-size:14px;font-weight:400}
.appmiu-view-controls{display:flex;gap:4px;flex:none}
.appmiu-view-controls button{padding:6px 10px;border:1px solid var(--appmiu-line);border-radius:7px;
color:var(--appmiu-ink);background:var(--appmiu-surface);cursor:pointer;font-size:13px;min-height:36px}
.appmiu-view-controls button[aria-pressed="true"]{background:var(--appmiu-pressed);color:#fff;border-color:var(--appmiu-pressed)}
html.appmiu-dark .appmiu-view-controls button[aria-pressed="true"]{color:#101522}

/* ---------- cards ---------- */
.appmiu-list-view{display:grid;gap:12px}
.appmiu-card{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:start;gap:0;padding:12px;
border-radius:14px;background:var(--appmiu-surface);border:1px solid var(--appmiu-line);transition:.18s}
@media(hover:hover){.appmiu-card:hover{box-shadow:var(--appmiu-shadow);transform:translateY(-2px);border-color:transparent}}
.appmiu-card__media{position:relative;width:100%;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
display:grid;place-items:center;background:linear-gradient(155deg,var(--c1),var(--c2));
box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.appmiu-card__media::after{content:"";position:absolute;inset:0;
background:radial-gradient(120% 80% at 50% 0,rgba(255,255,255,.28),transparent 62%)}
.appmiu-card__media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;z-index:2}
.appmiu-card__media .t{position:relative;z-index:1;padding:10px 8px;text-align:center;font-size:12px;
line-height:1.5;font-weight:700;color:#fffaf0;text-shadow:0 1px 2px rgba(0,0,0,.28);
display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.appmiu-card__media .g{position:absolute;z-index:1;bottom:7px;left:7px;font-size:10px;letter-spacing:.06em;
color:rgba(255,250,240,.85);background:rgba(0,0,0,.22);border-radius:4px;padding:2px 5px}
.appmiu-card__body{min-width:0;padding:0 0 0 14px}
.appmiu-card h3{font-size:17px;line-height:1.45;margin:0 0 7px;font-weight:700}
.appmiu-card h3 a:hover{color:var(--appmiu-accent-strong)}
.appmiu-card__body>p{font-size:13px;line-height:1.6;margin:0 0 10px;color:var(--appmiu-muted);
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.appmiu-card__meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px;color:var(--appmiu-muted)}
.appmiu-card__category{background:var(--appmiu-surface-soft);color:var(--appmiu-muted);font-size:11px;
font-weight:400;padding:3px 6px;border-radius:4px}
html.appmiu-dark .appmiu-card__category{background:var(--appmiu-surface-soft)}
.appmiu-card__footer{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;min-width:0}
.appmiu-btn{margin-left:auto;flex:none;display:inline-block;padding:8px 14px;border-radius:8px;border:0;cursor:pointer;
background:var(--appmiu-pressed);color:#fff;font-size:13px;transition:.16s;min-height:38px}
@media(hover:hover){.appmiu-btn:hover{background:var(--appmiu-accent-strong)}}
html.appmiu-dark .appmiu-btn{color:#101522}
.appmiu-btn.dead{background:var(--appmiu-surface-soft);color:var(--appmiu-muted);cursor:not-allowed}

/* grid view */
.appmiu-grid-view{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.appmiu-grid-view .appmiu-card,.appmiu-two-column-view .appmiu-card{display:flex;flex-direction:column;padding:16px}
.appmiu-grid-view .appmiu-card__media{width:100%;aspect-ratio:3/4;height:auto;min-height:0}
.appmiu-grid-view .appmiu-card__media .t{font-size:15px;padding:16px 12px}
.appmiu-grid-view .appmiu-card__body{padding:12px 0 0}
.appmiu-grid-view .appmiu-card h3{font-size:16px}

/* two-column view */
.appmiu-two-column-view{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.appmiu-two-column-view .appmiu-card__media{width:76px;aspect-ratio:3/4}
.appmiu-two-column-view .appmiu-card__media .t{font-size:11px;-webkit-line-clamp:4}
.appmiu-two-column-view .appmiu-card{padding:10px}
.appmiu-two-column-view .appmiu-card h3{font-size:14px;line-height:1.38;margin:0 0 4px}
.appmiu-two-column-view .appmiu-card__body{padding:0 0 0 10px}
.appmiu-two-column-view .appmiu-card__body>p{font-size:11.5px;line-height:1.45;margin:0;-webkit-line-clamp:1}
.appmiu-two-column-view .appmiu-card__footer{margin-top:4px;padding-top:6px}

.appmiu-empty{text-align:center;color:var(--appmiu-muted);padding:60px 0}
.appmiu-empty button{background:none;border:0;border-bottom:1px solid var(--appmiu-accent);
color:var(--appmiu-accent-strong);cursor:pointer;padding:0 0 2px;margin-top:6px}

.appmiu-foot{border-top:1px solid var(--appmiu-line);margin-top:20px;padding:22px 24px 46px;
text-align:center;font-size:12px;color:var(--appmiu-muted)}
.appmiu-foot b{color:var(--appmiu-ink);font-weight:400}
.appmiu-foot p{margin:0 0 6px;max-width:70ch}
.appmiu-foot code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--appmiu-ink)}

/* ---------- 手机端：吸顶入口 + 底部弹层 ---------- */
.appmiu-bar-btns{display:none}
.appmiu-sheet{display:none}
.appmiu-sheet h4{font-size:12px;color:var(--appmiu-muted);margin:18px 0 8px;font-weight:400;letter-spacing:.04em}
.appmiu-sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.appmiu-sheet-grid button{display:flex;align-items:center;justify-content:space-between;gap:6px;
min-height:46px;padding:0 12px;border:1px solid var(--appmiu-line);border-radius:10px;
background:var(--appmiu-surface);color:var(--appmiu-ink);font-size:14px;cursor:pointer;text-align:left}
.appmiu-sheet-grid button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appmiu-sheet-grid button b{font-size:11px;font-weight:400;opacity:.6;flex:none}
.appmiu-sheet-grid button[aria-pressed="true"]{background:var(--appmiu-pressed);color:#fff;border-color:var(--appmiu-pressed)}
html.appmiu-dark .appmiu-sheet-grid button[aria-pressed="true"]{color:#101522}
.appmiu-sheet-acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:18px}
.appmiu-sheet-acts .appmiu-filter-reset{min-height:46px;font-size:13px}
.appmiu-sheet-done{min-height:46px;border:0;border-radius:10px;background:var(--appmiu-accent);color:#fff;
font-size:14px;font-weight:700;cursor:pointer}
.appmiu-panel-scrim{display:none}
@media(max-width:1180px){
.appmiu-discovery__layout{grid-template-columns:220px minmax(0,1fr)}
.appmiu-discover-more{display:none}
}
@media(max-width:860px){
.appmiu-hero{padding:38px 18px 104px}
.appmiu-hero h1{font-size:clamp(26px,7vw,34px)}
.appmiu-hero__inner{max-width:520px}
.appmiu-hero-topics{display:none}                 /* 横滑 chips 在手机上够不到，分类改由底部弹层选 */
.appmiu-discovery{width:calc(100% - 24px);margin-top:14px;padding:14px 0 26px}
.appmiu-discovery__layout{grid-template-columns:1fr;gap:12px}
.appmiu-search-terms{width:calc(100% - 24px);margin-top:40px}
.appmiu-results{order:2}
.appmiu-results-summary{position:sticky;top:0;z-index:6;gap:8px;flex-wrap:wrap;border-radius:12px}
.appmiu-results-summary strong{flex:1 1 100%;order:-1;font-size:13px}
.appmiu-view-controls{display:none}
.appmiu-bar-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.appmiu-bar-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;
padding:0 12px;border:1px solid var(--appmiu-line);border-radius:10px;background:var(--appmiu-surface);
color:var(--appmiu-ink);font-size:14px;cursor:pointer}
.appmiu-bar-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appmiu-bar-btn i{font-style:normal;font-size:11px;opacity:.6;flex:none}
.appmiu-bar-btn.hot[aria-pressed="true"],.appmiu-bar-btn.on{background:var(--appmiu-pressed);color:#fff;border-color:var(--appmiu-pressed)}
body.panel-open .appmiu-panel-scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(10,16,26,.42)}
.appmiu-filter-panel{position:static;display:none}
body.panel-open .appmiu-filter-panel{display:flex;flex-direction:column;height:78vh;overflow:hidden;
position:fixed;top:auto;left:10px;right:10px;bottom:0;z-index:30;
padding:14px 14px calc(12px + env(safe-area-inset-bottom));
border-radius:18px 18px 0 0;background:var(--appmiu-surface);border:1px solid var(--appmiu-line);
box-shadow:0 -10px 44px rgba(10,16,26,.24)}
body.panel-open .appmiu-filter-panel__head{flex:none}
body.panel-open .appmiu-sheet{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.panel-open .appmiu-sheet-acts{position:sticky;bottom:0;background:var(--appmiu-surface);
padding-top:12px;box-shadow:0 -10px 18px rgba(10,16,26,.07)}
body.panel-open{overflow:hidden}
.appmiu-filter-panel__head{padding-bottom:12px;border-bottom:1px solid var(--appmiu-line);position:relative}
.appmiu-filter-panel__head::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);
width:38px;height:4px;border-radius:4px;background:var(--appmiu-line)}
.appmiu-filter,#reset{display:none}
.appmiu-sheet{display:block}
.appmiu-list-view{gap:10px}
}
@media(max-width:560px){
.appmiu-hero{padding:30px 14px 96px}
.appmiu-eyebrow{letter-spacing:.24em;font-size:11px}
.appmiu-hero__sub{font-size:13px;margin-top:10px}
.appmiu-hero-search{width:calc(100% - 24px);bottom:-18px;border-radius:14px;padding-left:14px;gap:8px}
.appmiu-hero-search svg{width:16px;height:16px}
.appmiu-hero-search input{height:46px;font-size:16px}              /* 16px：防止 iOS 聚焦时自动放大整页 */
.appmiu-hero-search button{min-width:46px;padding:0 10px;height:44px}
.appmiu-search-terms button{min-height:42px;padding:8px 14px;font-size:13.5px}
.appmiu-card{grid-template-columns:84px minmax(0,1fr);border-radius:12px;padding:9px;gap:0}
.appmiu-card h3{font-size:14.5px;margin-bottom:4px;line-height:1.4}
.appmiu-card__body{padding-left:11px}
.appmiu-card__body>p{font-size:12px;-webkit-line-clamp:1;margin-bottom:7px}
.appmiu-card__meta{gap:5px}
.appmiu-card__meta .tag-fmt,.appmiu-card__meta .tag-ver,.appmiu-card__meta .tag-no{display:none}
.appmiu-card__media .t{display:none}                               /* 小封面塞不下长标题，靠缩略图/色块本身 */
.appmiu-card__media .g{bottom:5px;left:5px;font-size:10px;padding:2px 6px}
.appmiu-card__footer{margin-top:8px}
.appmiu-list-view .appmiu-btn,.appmiu-two-column-view .appmiu-btn{width:100%;margin-left:0;text-align:center;
min-height:46px;padding:12px 14px}
.appmiu-grid-view{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.appmiu-grid-view .appmiu-card{padding:12px}
.appmiu-grid-view .appmiu-card__body{padding:10px 0 0}
.appmiu-grid-view .appmiu-card__media .t{display:grid}
.appmiu-two-column-view{grid-template-columns:1fr}
.appmiu-foot{padding:20px 14px calc(40px + env(safe-area-inset-bottom));font-size:11.5px}
}
</style>
</head>
<body>
<div id="page">

  <header class="appmiu-hero">
    <div class="appmiu-hero__inner">
      <p class="appmiu-eyebrow">摄影 · 书 籍 合 集</p>
      <h1>摄影书籍资源库</h1>
      <p class="appmiu-hero__sub" id="lede"></p>
      <div class="appmiu-hero-topics"><div class="appmiu-filter-chips" id="chips" aria-label="按分类方向筛选"></div></div>

const CS={"基础入门":["#1f4d5c","#2d6f80","相机怎么成像、曝光三要素、摄影入门第一课"],"器材·相机镜头":["#3a4f8f","#5568ab","机身、镜头、滤镜与器材选购"],"用光曝光":["#b8712a","#dc9748","布光、测光、光比与闪光灯运用"],"构图视角":["#2f6b3a","#4c9357","取景、画面组织与视角经营"],"人像写真":["#c0477f","#e2749f","人像姿态、外景与人像用光"],"风光旅行":["#146368","#2a8b91","风光、HDR、黑卡与旅拍"],"后期修图":["#4a5ea8","#6d7ec2","Photoshop / Lightroom 调色精修"],"色彩":["#7a2f2f","#a55050","色彩构成、白平衡与调色逻辑"],"夜景弱光":["#2b3a4a","#4a5c70","夜景、弱光与星空拍摄"],"黑白胶片":["#333a44","#5b6572","黑白、胶片与区域曝光法"],"婚纱婚礼":["#a83326","#cf5c3c","婚纱、婚礼跟拍流程与实拍"],"儿童家庭":["#cf8b22","#f2b95e","儿童、亲子与家庭摄影"],"商业产品":["#5b2a86","#7f4bb0","商品、静物与网店摄影"],"进阶提高":["#1d5c7a","#2f83ab","微距、专项技巧与能力拓展"],"技巧集锦":["#7a4a1f","#a56f36","杂项技巧与速成合集"],"教材课件":["#8c2f57","#b1467a","纽约摄影学院、北影、NYIP 等教材"],"理论修养":["#3d5a6c","#5f8496","摄影史、美学与理论"],"大师鉴赏":["#6b2f4a","#96506f","年鉴、大师作品集与风格研究"],"纪实街拍":["#26513f","#417a5e","纪实与街头摄影"]};
const TOTAL_GB=18.9, N=D.length;

const st={q:"",cat:"",fmt:"",pack:"",bulk:"",sort:"no",
  view:localStorage.getItem("pb-view")||(window.innerWidth<=860?"list":"grid")};

const el={};
["q","sort","chips","grid","empty","count","f-fmt","f-pack","f-bulk","lede","reset",
 "empty-reset","foot-total","quick","heat","heat-fmt","legend","theme","active-cat","stamp",
 "panel","scrim","btn-cat","btn-filter","s-cat","s-fmt","s-pack","s-bulk","s-sort","s-view",
 "s-reset","s-done"]
 .forEach(id=>{el[id]=document.getElementById(id)});
el.views=[...document.querySelectorAll(".appmiu-view-controls button")];

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.classList.toggle("appmiu-dark",t==="dark");
  el.theme.textContent=t==="dark"?"日":"夜";
  el.theme.setAttribute("aria-pressed",String(t==="dark"));
}
let savedTheme=null;try{savedTheme=localStorage.getItem("pb-theme")}catch(e){}
if(!savedTheme)savedTheme=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
applyTheme(savedTheme);
el.theme.onclick=()=>{
  const next=document.documentElement.classList.contains("appmiu-dark")?"light":"dark";
  applyTheme(next);try{localStorage.setItem("pb-theme",next)}catch(e){}
};

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtOf=d=>d.f||"PDF";
const packOf=d=>d.n>1?"多册成套":"单本";
function bulkOf(d){return d.mb>=100?"100MB 以上":d.mb>=20?"20-100MB":"20MB 以下"}
const short=name=>name.replace(/\.(pdf|doc|docx|ppt|pptx|rar|zip|epub)$/i,"").replace(/[_\s]+\d+$/,"").trim();
const FNS={fmtOf,packOf,bulkOf};
const uniq=key=>{const s={},o=[];D.forEach(d=>{const v=FNS[key](d);if(v&&!s[v]){s[v]=1;o.push(v)}});return o};
const countIn=(key,val)=>D.filter(d=>FNS[key](d)===val).length;
function full(d){return d.l+(d.p?(d.l.includes("?")?"&":"?")+"pwd="+d.p:"")}

function readHash(){
  const h=location.hash.replace(/^#/,"");if(!h)return;
  h.split("&").forEach(kv=>{const p=kv.split("=");
    if(p.length===2&&p[0]in st){try{st[p[0]]=decodeURIComponent(p[1])}catch(e){}}});
}
function writeHash(){
  const parts=[];
  for(const k in st){
    if(!st[k])continue;
    if((k==="sort"&&st.sort==="no")||(k==="view"&&st.view==="grid"))continue;
    parts.push(k+"="+encodeURIComponent(st[k]));
  }
  history.replaceState(null,"",parts.length?"#"+parts.join("&"):location.pathname);
}

function current(){
  const q=st.q.trim().toLowerCase().replace(/\s+/g,"");
  const out=D.filter(d=>{
    if(st.cat&&d.c!==st.cat)return false;
    if(st.fmt&&fmtOf(d)!==st.fmt)return false;
    if(st.pack&&packOf(d)!==st.pack)return false;
    if(st.bulk&&bulkOf(d)!==st.bulk)return false;
    if(q){const hay=(d.t+" "+d.c+" "+d.v+" "+fmtOf(d)+" "+d.no).toLowerCase().replace(/\s+/g,"");
      if(hay.indexOf(q)<0)return false}
    return true;
  });
  if(st.sort==="name")out.sort((a,b)=>a.t.localeCompare(b.t,"zh"));
  if(st.sort==="size")out.sort((a,b)=>b.mb-a.mb);
  if(st.sort==="cat")out.sort((a,b)=>(CATS.indexOf(a.c)-CATS.indexOf(b.c))||(a.no-b.no));
  return out;
}

/* ---------- chips ---------- */
function renderChips(){
  el.chips.innerHTML="";
  const mk=(label,val,n,color)=>{
    const b=document.createElement("button");
    b.type="button";b.setAttribute("aria-pressed",String(st.cat===val));
    if(color){const d=document.createElement("i");d.className="dot";d.style.background=color;b.appendChild(d)}
    const s=document.createElement("span");s.textContent=label;b.appendChild(s);
    const c=document.createElement("b");c.textContent=n;b.appendChild(c);
    b.onclick=()=>{st.cat=val;st.fmt=st.pack=st.bulk="";sync()};
    el.chips.appendChild(b);
  };
  mk("全部","",N,null);
  CATS.forEach(c=>{const n=D.filter(d=>d.c===c).length;if(n)mk(c,c,n,(CS[c]||["#5c7182"])[1])});
}

/* ---------- selects ---------- */
function fillSelect(node,stateKey,fnKey,allLabel,values){
  node.innerHTML="";
  const o=document.createElement("option");o.value="";o.textContent=allLabel;node.appendChild(o);
  values.forEach(v=>{
    const x=document.createElement("option");x.value=v;
    x.textContent=v+" · "+countIn(fnKey,v);
    node.appendChild(x);
  });
  node.value=values.indexOf(st[stateKey])>=0?st[stateKey]:"";
  st[stateKey]=node.value;
}

/* ---------- 手机端吸顶入口 + 底部弹层 ---------- */
const VIEWS={list:"列表",grid:"卡片",two:"双列"};
const isOpen=()=>document.body.classList.contains("panel-open");
function setPanel(on){
  document.body.classList.toggle("panel-open",!!on);
  el["btn-filter"].setAttribute("aria-pressed",String(!!on));
}
function grp(node,items,cur,choose){
  node.innerHTML="";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.type="button";b.setAttribute("aria-pressed",String(it[0]===cur));
    b.innerHTML=`<span>${esc(it[1])}</span>${it[2]?"<b>"+it[2]+"</b>":""}`;
    b.onclick=()=>choose(it[0]);
    node.appendChild(b);
  });
}
function renderSheet(){
  grp(el["s-cat"],[["","全部分类",N],...CATS.map(c=>[c,c,D.filter(d=>d.c===c).length])],st.cat,
      v=>{st.cat=v;st.fmt=st.pack=st.bulk="";setPanel(false);sync()});
  grp(el["s-fmt"],[["","不限",N],...uniq("fmtOf").sort((a,b)=>countIn("fmtOf",b)-countIn("fmtOf",a)).map(f=>[f,f,countIn("fmtOf",f)])],st.fmt,
      v=>{st.fmt=v;sync()});
  grp(el["s-pack"],[["","不限",N],["单本","单本",countIn("packOf","单本")],["多册成套","多册成套",countIn("packOf","多册成套")]],st.pack,
      v=>{st.pack=v;sync()});
  grp(el["s-bulk"],[["","不限",N],...["100MB 以上","20-100MB","20MB 以下"].map(x=>[x,x,countIn("bulkOf",x)])],st.bulk,
      v=>{st.bulk=v;sync()});
  grp(el["s-sort"],[["no","分类顺序"],["cat","书目数"],["size","体积大→小"],["name","按书名"]],st.sort,
      v=>{st.sort=v;sync()});
  grp(el["s-view"],Object.keys(VIEWS).map(k=>[k,VIEWS[k]]),st.view,v=>{
    st.view=v;try{localStorage.setItem("pb-view",v)}catch(e){}sync()});
}
el["btn-cat"].onclick=()=>setPanel(!isOpen());
el["btn-filter"].onclick=()=>setPanel(!isOpen());
el.scrim.onclick=()=>setPanel(false);
el["s-done"].onclick=()=>setPanel(false);
el["s-reset"].onclick=()=>{reset();};

/* ---------- card ---------- */
function card(d){
  const c=CS[d.c]||["#3a4a55","#5c7182",""];
  const url=d.ok?esc(full(d)):"";
  const img=d.img?`<img src="${esc(d.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:"";
  const btn=d.ok
    ?`<a class="appmiu-btn" href="${url}" target="_blank" rel="noopener nofollow">查看书籍</a>`
    :`<span class="appmiu-btn dead">无法分享</span>`;
  const art=document.createElement("article");
  art.className="appmiu-card";
  art.innerHTML=
    `${d.ok?`<a class="appmiu-card__media" style="--c1:${c[0]};--c2:${c[1]}" href="${url}" target="_blank" rel="noopener nofollow">`
      :`<div class="appmiu-card__media" style="--c1:${c[0]};--c2:${c[1]}">`}${img}
    <span class="t">${esc(short(d.t))}</span>
    <span class="g">${esc(d.n>1?"全"+d.n+"册":fmtOf(d))}</span>
    ${d.ok?"</a>":"</div>"}
    <div class="appmiu-card__body">
      <h3>${d.ok?`<a href="${url}" target="_blank" rel="noopener nofollow">`:""}${esc(d.t)}${d.ok?"</a>":""}</h3>
      <p>${esc(c[2]||d.c)}</p>
      <div class="appmiu-card__meta">
        <span class="appmiu-card__category">${esc(d.c)}</span>
        <span class="appmiu-card__category tag-fmt">${esc(fmtOf(d))}</span>
        <span class="appmiu-card__category">${d.mb} MB</span>
        ${d.n>1?`<span class="appmiu-card__category">全 ${d.n} 册</span>`:""}
        ${d.v?`<span class="appmiu-card__category tag-ver">${esc(d.v)}</span>`:""}
        <span class="tag-no">编号 ${String(d.no).padStart(4,"0")}</span>
      </div>
      <div class="appmiu-card__footer">${btn}</div>
    </div>`;
  return art;
}

/* ---------- side panels ---------- */
function renderSide(){
  el.heat.innerHTML="";
  CATS.map(c=>[c,D.filter(d=>d.c===c).length]).filter(x=>x[1])
    .sort((a,b)=>b[1]-a[1]).forEach(x=>{
      const b=document.createElement("button");b.type="button";b.textContent=x[0]+" "+x[1];
      b.onclick=()=>{st.cat=st.cat===x[0]?"":x[0];st.fmt=st.pack=st.bulk="";sync()};
      el.heat.appendChild(b);
    });
  el["heat-fmt"].innerHTML="";
  uniq("fmtOf").map(f=>[f,countIn("fmtOf",f)]).sort((a,b)=>b[1]-a[1])
    .forEach(x=>{
      const b=document.createElement("button");b.type="button";b.textContent=x[0]+" "+x[1];
      b.onclick=()=>{st.fmt=st.fmt===x[0]?"":x[0];sync()};
      el["heat-fmt"].appendChild(b);
    });
  el.quick.innerHTML="";
  [["构图","q"],["用光","q"],["人像","q"],["风光","q"],["纽约摄影学院","q"],["Lightroom","q"],
   ["Photoshop","q"],["胶片","q"],["大师","q"],["教材","q"],["街拍","q"],["夜景","q"]]
    .forEach(it=>{
      const b=document.createElement("button");b.type="button";b.textContent=it[0];
      b.onclick=()=>{st.q=it[0];st.cat="";st.fmt=st.pack=st.bulk="";sync();el.q.focus()};
      el.quick.appendChild(b);
    });
  el.legend.innerHTML=CATS.map(c=>{
    const s=CS[c]||["","",""];
    return `<li><b>${esc(c)} ${D.filter(d=>d.c===c).length}</b> —— ${esc(s[2]||"")}</li>`;
  }).join("");
  el["active-cat"].textContent=st.cat||"全部分类";
}

/* ---------- render ---------- */
function render(){
  const list=current();
  el.grid.className=st.view==="grid"?"appmiu-grid-view appmiu-list-view"
    :st.view==="two"?"appmiu-two-column-view appmiu-list-view":"appmiu-list-view";
  el.grid.innerHTML="";
  const frag=document.createDocumentFragment();
  list.forEach(d=>frag.appendChild(card(d)));
  el.grid.appendChild(frag);
  el.empty.hidden=list.length>0;
  el.count.textContent=`显示 ${list.length} / ${N} 本`;
  const s=CS[st.cat];
  el.lede.textContent=`${N} 本摄影书 · ${CATS.length} 个分类方向 · 共 ${TOTAL_GB} GB，全部为本人百度网盘直出链接`
    +(s?`｜${s[2]}`:"｜按学习路径排序：基础 → 器材 → 用光构图 → 题材 → 后期 → 教材与大师鉴赏");
  el.views.forEach(b=>b.setAttribute("aria-pressed",String(b.getAttribute("data-view")===st.view)));
  const n=["cat","fmt","pack","bulk"].filter(k=>st[k]).length;
  el["btn-cat"].querySelector("span").textContent=st.cat||"全部分类";
  el["btn-cat"].classList.toggle("on",!!st.cat);
  el["btn-filter"].querySelector("span").textContent="筛选"+(n?" · "+n+" 项":"")+" · "+VIEWS[st.view];
  el["btn-filter"].classList.toggle("on",n>0);
  el["s-done"].textContent="看结果 · "+list.length+" 本";
}

function sync(){
  renderChips();
  fillSelect(el["f-fmt"],"fmt","fmtOf","全部格式",uniq("fmtOf").sort((a,b)=>countIn("fmtOf",b)-countIn("fmtOf",a)));
  fillSelect(el["f-pack"],"pack","packOf","不限",["单本","多册成套"]);
  fillSelect(el["f-bulk"],"bulk","bulkOf","不限大小",["100MB 以上","20-100MB","20MB 以下"]);
  el.q.value=st.q;el.sort.value=st.sort;
  writeHash();renderSide();renderSheet();render();
}

el.q.oninput=()=>{st.q=el.q.value;writeHash();render()};
el.sort.onchange=()=>{st.sort=el.sort.value;writeHash();render()};
[["fmt","f-fmt"],["pack","f-pack"],["bulk","f-bulk"]].forEach(p=>{
  el[p[1]].onchange=()=>{st[p[0]]=el[p[1]].value;writeHash();render()};
});
const reset=()=>{st.q="";st.cat="";st.fmt=st.pack=st.bulk="";st.sort="no";sync()};
el.reset.onclick=reset;el["empty-reset"].onclick=reset;
el.views.forEach(b=>{b.onclick=()=>{st.view=b.getAttribute("data-view");
  try{localStorage.setItem("pb-view",st.view)}catch(e){}writeHash();render()}});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==el.q){e.preventDefault();el.q.focus()}});

/* ---------- 封面相对路径 ---------- */
D.forEach(d=>{d.img=d.k?"covers/"+d.k:""});

readHash();
el["foot-total"].textContent=N;
el.stamp.textContent=` 更新于 2026-10-24。`;
sync();
</script>
